<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    
    <style>
        body{
            /* background: linear-gradient(rgb(189, 140, 140),rgb(25, 23, 23)); */
            background-color: black;
        }
        .img {
            height: 350px;
            width: 200px;
            object-fit: cover;
            border-radius: 10px;
            
        }
        .container {
            width: 200px;
            height: 350px;
            position: absolute;
            top: 15%;
            left: 40%;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            animation: gallery 30s linear infinite;
        }
        span {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center;
            transform: rotateY(calc(var(--i) * 45deg)) translateZ(250px);
        }
        @keyframes gallery {
            0% { transform: perspective(1000px) rotateY(0deg); }
            100% { transform: perspective(1000px) rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <span style="--i:1"><img class="img" src="/asstes/image/1ea70d70-90d2-4ad3-a1ce-462ea595f383.jpg" alt=""></span>
        <span style="--i:2"><img class="img" src="/asstes/image/2023 Kerala Adventure_ Nature, Culture, and Beyond.jpg" alt=""></span>
